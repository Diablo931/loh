<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рисующееся сердечко</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden; display: grid;
      place-items: center; background: #000; color: #fff;
      font: 500 16px system-ui, sans-serif;
    }
    canvas { width: min(92vw, 660px); height: min(82vh, 660px); cursor: pointer; }
    .hint { position: fixed; bottom: 28px; opacity: .65; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="heart"></canvas>
  <div class="hint">Нажми, чтобы нарисовать сердечко заново</div>

  <script>
    const canvas = document.querySelector('#heart');
    const ctx = canvas.getContext('2d');
    const colors = ['#ff3131', '#ff8c00', '#ffe600', '#35d04b', '#23c7f3', '#5478ff', '#b84dff', '#ff4fbd'];
    let animation;

    function sizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const pixelRatio = window.devicePixelRatio || 1;
      canvas.width = rect.width * pixelRatio;
      canvas.height = rect.height * pixelRatio;
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    // Координаты точки на контуре математического сердечка.
    function heartPoint(t, scale, centerX, centerY) {
      const x = 16 * Math.sin(t) ** 3;
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x: centerX + x * scale, y: centerY - y * scale };
    }

    function drawHeart() {
      cancelAnimationFrame(animation);
      sizeCanvas();
      const { width, height } = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height / 2 + 18;
      const scale = Math.min(width, height) / 39;
      const totalLines = 180;
      const drawingTime = 7000;
      const delayPerLine = drawingTime / totalLines;
      let line = 0;
      let lastStep = 0;

      function nextLine(time) {
        if (!lastStep) lastStep = time;
        if (time - lastStep >= delayPerLine && line < totalLines) {
          lastStep = time;
          // Один луч примерно каждые 39 мс — всего около 7 секунд.
          for (let n = 0; n < 1 && line < totalLines; n++, line++) {
          const t = (line / totalLines) * Math.PI * 2;
          const point = heartPoint(t, scale, centerX, centerY);
          const color = colors[line % colors.length];

          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.lineTo(point.x, point.y);
          ctx.strokeStyle = color;
          ctx.globalAlpha = .72;
          ctx.lineWidth = 1.25;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(point.x, point.y, 2.6, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.globalAlpha = 1;
          ctx.fill();
          }
        }
        if (line < totalLines) animation = requestAnimationFrame(nextLine);
      }
      nextLine();
    }

    window.addEventListener('resize', drawHeart);
    canvas.addEventListener('click', () => {
      drawHeart();
    });
    drawHeart();
  </script>
</body>
</html>
